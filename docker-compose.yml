services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: loupe
      POSTGRES_PASSWORD: loupe
      POSTGRES_DB: loupe
    ports:
      - "5432:5432"
    volumes:
      - loupe-pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  loupe-pg:
